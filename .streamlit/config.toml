[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's own menu (Deploy, Rerun, Settings) from visitors.
toolbarMode = "minimal"

[theme]
# A deep navy accent (buttons, focus outline, checkbox, links) in place of
# Streamlit's default red, which reads as an error. White text on it has a
# contrast of 11:1.
primaryColor = "#1f3a5f"
linkColor = "#1f4e8c"
baseRadius = "small"
showSidebarBorder = true
# SF Pro on Apple devices (the system font); Inter, a close match that also
# covers Greek and Cyrillic, everywhere else.
font = "-apple-system, BlinkMacSystemFont, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "-apple-system, BlinkMacSystemFont, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 500, 500]
# Visible outlines on input fields (password, chat box, dropdown): a grey with
# at least 3:1 contrast against white, as accessibility guidelines ask.
showWidgetBorder = true
borderColor = "#858f9e"
# A soft warm sand for input fields (the question box, password, dropdown) and the
# sidebar, so the place to type stands out from the white page.
secondaryBackgroundColor = "#f5efe3"
